[databases]
quickflow = host=host.docker.internal port=5432 dbname=quickflow
quickflow_test = host=host.docker.internal port=5432 dbname=quickflow_test

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
# Modo mais eficiente: uma conexão real só é emprestada pela duração de UMA transação — seguro
# aqui porque todo `SET`/`set_config` deste projeto já é sempre transaction-scoped (nunca
# sessão-scoped), verificado desde a Fase 1 original.
pool_mode = transaction
max_client_conn = 1000
# 40 por banco (quickflow + quickflow_test) — se ambos os pools ficarem saturados ao mesmo tempo,
# 40+40=80 não sobra muita folga do max_connections=100 do Postgres local; não é um problema hoje
# (dev e test normalmente não rodam a todo vapor ao mesmo tempo), mas vale reavaliar quando a Task 8
# medir de verdade.
#
# IMPORTANTE — este número sozinho NÃO resolveu a instabilidade da suíte e2e inteira: subir de 20
# pra 40 sozinho piorou o resultado (17 testes falhando, vs. 11 antes), não melhorou. Quem realmente
# corrigiu foi limitar a paralelização do PRÓPRIO Jest (`--maxWorkers` no script `test:e2e` de
# `backend/package.json`, hoje em 1 — totalmente serial, ver Task 10) — múltiplos arquivos de teste
# e2e sobem cada um sua própria app Nest + vários clients de tenant como processos do SO
# genuinamente concorrentes, e isso gera um pico de conexões que nenhum tamanho de pool sozinho
# absorve instantaneamente. `--maxWorkers=2` (Task 7) já resolvia a suíte de então, mas o teste de
# stress da Task 8 (150 conexões reais concorrentes num único arquivo) reintroduziu uma flakiness
# mais estreita quando rodava ao lado de OUTRO arquivo no segundo worker — só desapareceu de vez
# indo pra `--maxWorkers=1` (achado na validação final da Task 10, 2 execuções consecutivas
# limpas). Não reverta pra um valor maior achando que o tamanho do pool já resolveu — sem a
# serialização, a suíte volta a ficar instável. Medição real de capacidade (dos dois lados) segue
# em aberto, documentada no relatório da Task 8.
default_pool_size = 40
# Ambiente de desenvolvimento local apenas — auth_type=plain não é adequado pra produção;
# estratégia de produção fica pra uma conversa própria quando o deploy real for iniciado.
