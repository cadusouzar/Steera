[databases]
quickflow = host=host.docker.internal port=5432 dbname=quickflow
quickflow_test = host=host.docker.internal port=5432 dbname=quickflow_test

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
# Modo mais eficiente: uma conexão real só é emprestada pela duração de UMA transação — seguro
# aqui porque todo `SET`/`set_config` deste projeto já é sempre transaction-scoped (nunca
# sessão-scoped), verificado desde a Fase 1 original.
pool_mode = transaction
max_client_conn = 1000
# 40 por banco (quickflow + quickflow_test), bem abaixo do max_connections=100 do Postgres local —
# achado ao rodar a suíte e2e inteira: o default de 20 gargalava sob a paralelização padrão do
# Jest (múltiplos arquivos de teste, cada um subindo sua própria app Nest + vários clients de
# tenant), causando timeouts/erros de conexão que nunca apareciam falando direto com o Postgres
# (max_connections=100 tinha folga de sobra). Medição real de capacidade fica pra Task 8.
default_pool_size = 40
# Ambiente de desenvolvimento local apenas — auth_type=plain não é adequado pra produção;
# estratégia de produção fica pra uma conversa própria quando o deploy real for iniciado.
